<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Section - GPU Showcase</title>
  <style>
    /* ==========================================================================
       1. Global Resets & Base Styles
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #050508;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ==========================================================================
       2. Hero Section Container & Background
       ========================================================================== */
    .hero-container {
      width: 100%;
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Background Circuit Image */
      background-image: url('bg-landscape.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    /* Optional dark overlay to ensure text contrast over circuit background */
    .hero-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(5, 5, 8, 0.45);
      z-index: 1;
    }

    /* ==========================================================================
       3. Hero Layout (Grid)
       ========================================================================== */
    .hero {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
      padding: 2rem 2rem;
      display: grid;
      grid-template-columns: 1fr 1.25fr; /* Gives extra space to the GPU side */
      align-items: center;
      gap: 2rem;
    }

    /* ==========================================================================
       4. Left Column: Text & Content
       ========================================================================== */
    .hero-content {
      max-width: 580px;
    }

    .hero-badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 20px;
      color: #00e5ff;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1.25rem;
      background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-description {
      font-size: 1.125rem;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .btn-primary {
      padding: 0.9rem 2rem;
      background: linear-gradient(135deg, #3b82f6, #00e5ff);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0, 229, 255, 0.5);
    }

    .btn-secondary {
      padding: 0.9rem 2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* ==========================================================================
       5. Right Column: GPU Image Fixes
       ========================================================================== */
    .hero-graphic {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .gpu-image {
      /* Scale & Size */
      width: 140%; 
      max-width: 850px;
      height: auto;
      transform: scale(1.15) translateX(20px);
      
      /* CRITICAL: Drops out the solid black JPG background */
      mix-blend-mode: screen; 

      /* Enhances contrast and brightness so the hardware details pop out */
      filter: contrast(1.25) brightness(1.15) saturate(1.1);

      pointer-events: none;
      user-select: none;
    }

    /* ==========================================================================
       6. Responsive Breakpoints
       ========================================================================== */
    @media (max-width: 1024px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
        padding-top: 4rem;
        padding-bottom: 4rem;
      }

      .hero-content {
        margin: 0 auto;
      }

      .hero-actions {
        justify-content: center;
      }

      .gpu-image {
        width: 100%;
        transform: scale(1) translateX(0);
        margin-top: 2rem;
      }
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <section class="hero">
      
      <!-- Left Column: Content -->
      <div class="hero-content">
        <span class="hero-badge">Next-Gen Performance</span>
        <h1 class="hero-title">Extreme Computing Power</h1>
        <p class="hero-description">
          Engineered for high-throughput AI workloads, real-time rendering, and advanced ray tracing. Experience unmatched speed and architecture precision.
        </p>
        <div class="hero-actions">
          <a href="#" class="btn-primary">Explore Specs</a>
          <a href="#" class="btn-secondary">Watch Demo</a>
        </div>
      </div>

      <!-- Right Column: GPU Graphic -->
      <div class="hero-graphic">
        <img 
          src="gpu-transparent.jpg" 
          alt="GPU Graphics Card" 
          class="gpu-image"
        />
      </div>

    </section>
  </div>

</body>
</html>
